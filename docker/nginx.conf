# App (Expo web export) at /, team findings hub at /findings/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    charset_types text/html text/plain text/css application/javascript application/json;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed bundles from `expo export` never change under the same name
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /findings/ {
        try_files $uri $uri/ =404;
    }

    # Lists every figure, including ones added by a later sync that the hub page doesn't name
    location /findings/figures/ {
        autoindex on;
    }

    # Markdown notes open as text in the browser instead of downloading
    location ~* \.md$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # Single-page app
    location / {
        try_files $uri /index.html;
    }
}
